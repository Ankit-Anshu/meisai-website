name: Deploy Meisai website

on:
  push:
    branches: [main, master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static website
        run: node website/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          CHROME_WEB_STORE_URL: ${{ vars.CHROME_WEB_STORE_URL }}
          FIREFOX_ADDONS_URL: https://addons.mozilla.org/en-US/firefox/addon/meisai-workspace/
          BRAVE_EXTENSION_URL: ${{ vars.BRAVE_EXTENSION_URL }}
          FEEDBACK_URL: https://forms.gle/sGxecwiz6z5R2UNB6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
